name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Daily rebuild, in step with the Azure deploy (see scripts/buildCards.js).
  schedule:
    - cron: '10 9 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Build
        env:
          PUBLIC_URL: /destroyallhumans
          REACT_APP_ROBOTS: noindex, follow
          CI: 'false'
        run: npm run build

      - name: Copy SPA 404 fallback
        run: cp build/index.html build/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
